---
- name: Maintain Ubuntu and Fedora Machines
  hosts: all
  become: true

  tasks:
    - name: Load OS-specific variables
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ ansible_os_family }}.yml"
          paths:
            - base

    - name: Ensure system packages are up to date (Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Ensure system packages are up to date (Fedora)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Install common required packages
      ansible.builtin.package:
        name: "{{ common_packages }}"
        state: present

    - name: Ensure NTP service is running
      ansible.builtin.systemd:
        name: "{{ ntp_service }}"
        state: started
        enabled: true
