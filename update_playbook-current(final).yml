---
- name: Advanced Cross-Platform Update, Security, and Syslog Configuration
  hosts: all:!syslog_server # Applies to all nodes except the logging server itself
  become: yes
  vars:
    common_packages:
      - git
      - curl
      - vim
      - nano
    syslog_server_ip: "10.0.0.92"

  tasks:
    # ====================================================
    # 1. OS Updates and Conditional Reboots
    # ====================================================
    - name: Update Ubuntu/Debian packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: Check if Ubuntu reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: ubuntu_reboot_file
      when: ansible_distribution == 'Ubuntu'

    - name: Reboot Ubuntu if required
      ansible.builtin.reboot:
        msg: "Rebooting Ubuntu due to kernel/package updates"
      when: ansible_distribution == 'Ubuntu' and ubuntu_reboot_file.stat.exists

    - name: Update Fedora packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
      register: dnf_update_result
      when: ansible_distribution == 'Fedora'

    - name: Reboot Fedora if kernel/systemd updated
      ansible.builtin.reboot:
        msg: "Rebooting Fedora due to critical package updates"
      when: >
        ansible_distribution == 'Fedora' and 
        dnf_update_result.changed and 
        ('kernel' in dnf_update_result.results or 'systemd' in dnf_update_result.results)

    - name: Update FreeBSD packages and database
      community.general.pkgng:
        name: "*"
        state: latest
      when: ansible_distribution == 'FreeBSD'

    - name: Update OpenBSD packages
      community.general.openbsd_pkg:
        name: "*"
        state: latest
      when: ansible_distribution == 'OpenBSD'

    # ====================================================
    # 2. Install Common Packages
    # ====================================================
    - name: Install common packages on Linux targets
      ansible.builtin.package:
        name: "{{ common_packages }}"
        state: present
      when: ansible_os_family in ['Debian', 'RedHat']

    - name: Install common packages on FreeBSD
      community.general.pkgng:
        name: "{{ common_packages }}"
        state: present
      when: ansible_distribution == 'FreeBSD'

    - name: Install common packages on OpenBSD
      community.general.openbsd_pkg:
        name: "{{ common_packages }}"
        state: present
      when: ansible_distribution == 'OpenBSD'

    # ====================================================
    # 3. NTP Templates and Service Configuration
    # ====================================================
    - name: Deploy Ubuntu NTP configuration
      ansible.builtin.template:
        src: ntp_templates/ubuntu.conf.j2
        dest: /etc/ntp.conf
        owner: root
        group: root
        mode: '0644'
      when: ansible_distribution == 'Ubuntu'
      notify: Restart Ubuntu NTP

    - name: Deploy Fedora Chrony configuration
      ansible.builtin.template:
        src: ntp_templates/fedora.conf.j2
        dest: /etc/chrony.conf
        owner: root
        group: root
        mode: '0644'
      when: ansible_distribution == 'Fedora'
      notify: Restart Fedora Chrony

    - name: Deploy FreeBSD NTP configuration
      ansible.builtin.template:
        src: ntp_templates/freebsd.conf.j2
        dest: /etc/ntp.conf
        owner: root
        group: wheel
        mode: '0644'
      when: ansible_distribution == 'FreeBSD'
      notify: Restart FreeBSD NTP

    - name: Deploy OpenBSD OpenNTPD configuration
      ansible.builtin.template:
        src: ntp_templates/openbsd.conf.j2
        dest: /etc/ntpd.conf
        owner: root
        group: wheel
        mode: '0644'
      when: ansible_distribution == 'OpenBSD'
      notify: Restart OpenBSD NTP

    - name: Ensure NTP service states
      ansible.builtin.service:
        name: "{{ 'ntp' if ansible_distribution == 'Ubuntu' else 'chronyd' if ansible_distribution == 'Fedora' else 'ntpd' }}"
        state: started
        enabled: yes

    # ====================================================
    # 4. Centralized Syslog Configuration (Restricted Severity)
    # ====================================================
    # Linux distributions use rsyslog
    - name: Configure restricted rsyslog forwarding for Linux (Ubuntu/Fedora)
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        marker: "# {mark} ANSIBLE REMOTE FORWARDING"
        create: yes
        block: |
          auth.* @{{ syslog_server_ip }}:514
          *.err  @{{ syslog_server_ip }}:514
      when: ansible_os_family in ['Debian', 'RedHat']
      notify: Restart Linux Rsyslog

    # FreeBSD native syslogd requires separate lines for each selector targeting a host
    - name: Configure restricted remote syslog forwarding on FreeBSD
      ansible.builtin.blockinfile:
        path: /etc/syslog.conf
        marker: "# {mark} ANSIBLE REMOTE FORWARDING"
        create: yes
        block: |
          auth.* @{{ syslog_server_ip }}
          *.err  @{{ syslog_server_ip }}
      when: ansible_distribution == 'FreeBSD'
      notify: Restart FreeBSD Syslog

    # OpenBSD native syslogd requires tabs between selectors and the destination host
    - name: Configure restricted remote syslog forwarding on OpenBSD
      ansible.builtin.blockinfile:
        path: /etc/syslog.conf
        marker: "# {mark} ANSIBLE REMOTE FORWARDING"
        create: yes
        block: |
          auth.*	@{{ syslog_server_ip }}
          *.err	@{{ syslog_server_ip }}
      when: ansible_distribution == 'OpenBSD'
      notify: Restart OpenBSD Syslog

    # ====================================================
    # 5. Consolidated Network Firewall Configuration
    # ====================================================
    # --- Ubuntu Firewall (UFW) ---
    - name: Allow SSH on Ubuntu via UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH
      when: ansible_distribution == 'Ubuntu'

    - name: Enable UFW with default deny incoming on Ubuntu
      community.general.ufw:
        state: enabled
        direction: incoming
        default: deny
      when: ansible_distribution == 'Ubuntu'

    # --- Fedora Firewall (Firewalld) ---
    - name: Ensure firewalld package is present on Fedora
      ansible.builtin.dnf:
        name: firewalld
        state: present
      when: ansible_distribution == 'Fedora'

    - name: Ensure firewalld service is active on Fedora
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: yes
      when: ansible_distribution == 'Fedora'

    - name: Allow SSH on Fedora via Firewalld
      ansible.posix.firewalld:
        service: ssh
        permanent: yes
        immediate: yes
        state: enabled
      when: ansible_distribution == 'Fedora'

    # --- BSD Firewall (PF Packet Filter) ---
    - name: Configure basic pf rules for FreeBSD/OpenBSD
      ansible.builtin.blockinfile:
        path: /etc/pf.conf
        create: yes
        owner: root
        group: wheel
        mode: '0600'
        block: |
          # Consolidated PF Ruleset
          set skip on lo0
          block in all
          pass out all keep state
          # Management & Services
          pass in proto tcp to any port ssh keep state
          pass in proto udp to any port ntp keep state
      when: ansible_distribution in ['FreeBSD', 'OpenBSD']
      notify: Reload PF Firewall

    - name: Ensure PF Firewall is enabled on FreeBSD
      community.general.sysrc:
        name: pf_enable
        value: "YES"
      when: ansible_distribution == 'FreeBSD'
      notify: Reload PF Firewall

    - name: Ensure PF Firewall is enabled on OpenBSD
      ansible.builtin.lineinfile:
        path: /etc/rc.conf.local
        line: 'pf=YES'
        create: yes
      when: ansible_distribution == 'OpenBSD'
      notify: Reload PF Firewall

  # ====================================================
  # Handlers
  # ====================================================
  handlers:
    - name: Restart Ubuntu NTP
      ansible.builtin.service:
        name: ntp
        state: restarted

    - name: Restart Fedora Chrony
      ansible.builtin.service:
        name: chronyd
        state: restarted

    - name: Restart FreeBSD NTP
      community.general.service:
        name: ntpd
        state: restarted

    - name: Restart OpenBSD NTP
      ansible.builtin.service:
        name: ntpd
        state: restarted

    - name: Restart Linux Rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

    - name: Restart FreeBSD Syslog
      community.general.service:
        name: syslogd
        state: restarted

    - name: Restart OpenBSD Syslog
      ansible.builtin.service:
        name: syslogd
        state: restarted

    - name: Reload PF Firewall
      ansible.builtin.command: pfctl -f /etc/pf.conf
      failed_when: false
