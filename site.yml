---

- hosts: all
  become: true
  pre_tasks:
   
  - name: update repository index (CentOS)
    tags: always
    dnf:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "CentOS"

  - name: update repository index (Ubuntu)
    tags: always
    apt:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Ubuntu"

  - name: update repository index (Fedora)
    tags: always
    apt:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Fedora"

- hosts: all
  become: true
  roles:
    - base
   
- hosts: workstations
  become: true
  roles:
    - workstations

- hosts: hypervisors
  become: true
  roles:
    - hypervisors

- hosts: file_servers
  become: true
  roles:
    - file_servers
    
- hosts: db_servers
  become: true
  roles:
    - db_servers

- hosts: media_servers
  become: true
  roles:
    - media_servers

- hosts: web_servers
  become: true
  roles:
    - web_servers
